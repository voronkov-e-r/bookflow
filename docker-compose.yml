services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: default
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: bookflow
    ports:
      - "5432:5432"
    volumes:
      - bookflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U default -d bookflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:7
    container_name: mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672" 
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: secret
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth:
    build:
      context: .
      args:
        SERVICE: auth
    environment:
      DB_URL: "postgres://bookapi:secret@postgres:5432/bookapi?sslmode=disable"
      PORT: ":50051"
    ports:
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy

  catalog:
    build:
      context: .
      args:
        SERVICE: catalog
    environment:
      MONGO_URI: "mongodb://admin:secret@mongodb:27017/?authSource=admin"
      PORT: ":50052"
    ports:
      - "50052:50052"
    depends_on:
      mongodb:
        condition: service_healthy

  order:
    build:
      context: .
      args:
        SERVICE: order
    environment:
      DB_URL: "postgres://bookapi:secret@postgres:5432/bookapi?sslmode=disable"
      RABBITMQ_URL: "amqp://admin:secret@rabbitmq:5672/"
      CATALOG_URL: "catalog:50052"
      PORT: ":50053"
    ports:
      - "50053:50053"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      catalog:
        condition: service_started

  notification:
    build:
      context: .
      args:
        SERVICE: notification
    environment:
      RABBITMQ_URL: "amqp://admin:secret@rabbitmq:5672/"
    depends_on:
      rabbitmq:
        condition: service_healthy

  gateway:
    build:
      context: .
      args:
        SERVICE: gateway
    environment:
      AUTH_URL: "auth:50051"
      CATALOG_URL: "catalog:50052"
      ORDER_URL: "order:50053"
      PORT: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      - auth
      - catalog
      - order

volumes:
  bookflow-pgdata:
  mongodb-data:
  rabbitmq-data: