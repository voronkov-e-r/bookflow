services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: default
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: bookflow
    ports:
      - "5432:5432"
    volumes:
      - bookflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bookflow-pgdata: